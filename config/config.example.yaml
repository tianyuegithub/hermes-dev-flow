# Dev-Flow 配置文件
# 由 `hermes-dev-flow setup` 交互生成，也可手动编辑
# 路径: ~/.hermes/dev-flow/config.yaml

# ── Claude Code API（必填） ──────────────────────────────
claude:
  base_url: "https://open.bigmodel.cn/api/anthropic"   # 或 Anthropic 官方: https://api.anthropic.com
  api_key: ""                                           # 智谱 API key 或 Anthropic API key

# ── OpenAI API（可选，Codex Worker 用） ───────────────────
openai:
  api_key: ""                                           # OpenAI API key (sk-...)

# ── OpenCode API（可选，多模型供应商） ─────────────────────
opencode:
  api_key: ""                                           # 如果和 Claude 共用则留空
  base_url: ""                                          # 如果和 Claude 共用则留空
  model: "auto"                                         # auto 自动选择

# ── Git 仓库（支持多个） ────────────────────────────────────
repos:
  - url: "ssh://git@192.168.31.7:30022/datavdl/deer-flow.git"
    clone_url: "ssh://git@192.168.31.7:30022"
    default_branch: "main"
    platform: "gitea"
    triggers: ["deer-flow", "deerflow", "灵境"]
  # - url: "ssh://git@github.com/user/another-project.git"
  #   clone_url: "ssh://git@github.com"
  #   default_branch: "main"
  #   platform: "github"
  #   triggers: ["another-project", "另一个项目"]

# ── Gitea API（可选，开 PR 用） ──────────────────────────
gitea:
  url: "http://192.168.31.7:30000"
  api_url: "http://192.168.31.7:30000/api/v1"
  owner: "tianyue"
  repo_name: "deer-flow"

# ── Redis（可选，L1 用） ──────────────────────────────────
redis:
  host: "192.168.31.173"
  port: 32319
  internal_host: "redis.infra.svc.cluster.local"        # K3s 内部地址
  internal_port: 6379

# ── K8s（可选，L1 用） ───────────────────────────────────
k8s:
  namespace: "dev-flow"
  deployment: "dev-flow-worker"
  image: "192.168.31.200:8080/dev-flow/worker:latest"

# ── Worker Pod（L1 用） ──────────────────────────────────
worker:
  max_turns: 30
  max_budget_usd: 1.50
  heartbeat_interval: 30
  heartbeat_ttl: 60

# ── Worker 镜像源（L1 用） ────────────────────────────────
image:
  source: "ghcr.io"                                    # ghcr.io | docker.io | harbor
  url: "ghcr.io/<user>/hermes-dev-flow/worker:latest"  # 公开拉取地址

# ── 路径 ─────────────────────────────────────────────────
paths:
  tasks_dir: "~/.hermes/dev-flow/tasks"
  worktrees_dir: "~/.hermes/dev-flow/worktrees"
  scripts_dir: "~/.hermes/dev-flow/scripts"
