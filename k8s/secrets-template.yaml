# Dev-Flow K8s Secrets 模板
# 使用时替换 <PLACEHOLDER> 为真实凭据
# 不要将此文件提交到公开仓库！
---
apiVersion: v1
kind: Secret
metadata:
  name: dev-flow-secrets
  namespace: dev-flow
type: Opaque
stringData:
  # ── Claude Code（智谱或 Anthropic 兼容 API） ──
  ANTHROPIC_AUTH_TOKEN: "<your-claude-api-key>"
  ANTHROPIC_BASE_URL: "<your-api-base-url>"

  # ── OpenAI Codex ──
  OPENAI_API_KEY: "<your-openai-api-key>"

  # ── OpenCode（多供应商，以下至少填一组） ──
  # 如果你用 Anthropic 兼容 API，复用上面的 ANTHROPIC_AUTH_TOKEN 即可
  # 如果你用自定义供应商：
  OPENCODE_API_KEY: "<your-opencode-api-key>"
  OPENCODE_BASE_URL: "<your-opencode-base-url>"
  OPENCODE_MODEL: "auto"

  # ── Git SSH ──
  GITEA_SSH_KEY: |
    <your-ssh-private-key>
