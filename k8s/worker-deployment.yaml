---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-flow-worker
  namespace: dev-flow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-flow-worker
  template:
    metadata:
      labels:
        app: dev-flow-worker
    spec:
      # 修改说明：修复 SSH key 权限 — 确保挂载文件归属 worker 用户组 | 修改时间：2026-07-03
      securityContext:
        fsGroup: 1000
      containers:
      - name: worker
        image: 192.168.31.200:8080/dev-flow/worker:v2
        imagePullPolicy: Always
        env:
        - name: REDIS_HOST
          value: "redis.infra.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: REPO_URL
          value: "ssh://git@192.168.31.7:30022/datavdl/deer-flow.git"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: ANTHROPIC_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: dev-flow-secrets
              key: ANTHROPIC_AUTH_TOKEN
        - name: ANTHROPIC_BASE_URL
          value: "https://open.bigmodel.cn/api/anthropic"
        # 修改说明：Codex Worker — 双 CLI 支持 | 修改时间：2026-07-03
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: dev-flow-secrets
              key: OPENAI_API_KEY
        volumeMounts:
        - name: ssh-key
          mountPath: /home/worker/.ssh/id_rsa
          subPath: id_rsa
      volumes:
      - name: ssh-key
        secret:
          secretName: dev-flow-secrets
          items:
          - key: GITEA_SSH_KEY
            path: id_rsa
          defaultMode: 0600
