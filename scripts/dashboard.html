<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dev-Flow · AI 开发流程编排</title>
<style>
:root {
  --bg: #000000; --bg-secondary: #0d0d0d; --surface: #151515; --surface-2: #1c1c1e; --surface-3: #262628;
  --text: #f5f5f7; --text-secondary: rgba(255,255,255,0.64); --text-tertiary: rgba(255,255,255,0.42);
  --accent: #0071e3; --accent-glow: rgba(0,113,227,0.3);
  --good: #30d158; --warn: #ff9f0a; --bad: #ff453a;
  --glass: rgba(29,29,31,0.72); --glass-border: rgba(255,255,255,0.08);
  --mono: "SF Mono","Fira Code",ui-monospace,monospace;
  --radius-sm: 8px; --radius: 12px; --radius-lg: 20px; --radius-pill: 980px;
  --shadow-card: 0 2px 16px rgba(0,0,0,0.4);
  --font: system-ui, -apple-system, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.47;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.nav-glass{position:sticky;top:0;z-index:50;height:52px;background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0}
.nav-glass .logo{font-size:15px;font-weight:700;letter-spacing:-0.3px;color:var(--text)}
.nav-glass .status{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--text-secondary)}
.nav-glass .status .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-online{background:var(--good)}.dot-offline{background:var(--text-tertiary)}
.app-layout{display:grid;grid-template-columns:280px 1fr 380px;flex:1;overflow:hidden}
.sidebar{background:var(--bg-secondary);border-right:1px solid var(--glass-border);padding:16px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
.sidebar h3{font-size:11px;font-weight:600;letter-spacing:0.24em;color:var(--text-tertiary);text-transform:uppercase;margin:12px 0 4px;padding-left:8px}
.task-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;font-size:12px;letter-spacing:-0.2px;border-left:2px solid transparent}
.task-item:hover{background:var(--surface)}
.task-item.active{background:var(--surface-2);border-left-color:var(--accent)}
.task-item .id{font-family:var(--mono);font-size:10px;color:var(--text-tertiary);flex-shrink:0;min-width:50px}
.task-item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-item .badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:var(--radius-pill);flex-shrink:0;letter-spacing:0.1em}
.badge-done{background:rgba(48,209,88,0.12);color:var(--good)}
.badge-running{background:rgba(0,113,227,0.15);color:var(--accent);animation:pulse 2s infinite}
.badge-pending{background:rgba(255,255,255,0.05);color:var(--text-tertiary)}
.badge-failed{background:rgba(255,69,58,0.12);color:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.stop-btn{font-size:10px;background:var(--bad);color:#fff;border:none;border-radius:var(--radius-sm);padding:2px 8px;cursor:pointer;display:none}
.task-item:hover .stop-btn{display:inline-block}
.task-item.highlight{animation:highlight 1s}
@keyframes highlight{0%{background:var(--accent-glow)}100%{background:transparent}}
.main{overflow-y:auto;padding:24px}
.main h2{font-size:26px;font-weight:600;letter-spacing:-0.4px;line-height:1.1;margin-bottom:4px}
.main .subtitle{font-size:14px;color:var(--text-secondary);margin-bottom:20px;letter-spacing:-0.2px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px}
.metric-card{background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px}
.metric-card .label{font-size:11px;letter-spacing:0.2em;color:var(--text-tertiary);text-transform:uppercase}
.metric-card .value{font-size:36px;font-weight:600;letter-spacing:-1px;line-height:1.1;margin-top:4px}
.metric-card .trend{font-size:11px;color:var(--good);margin-top:2px}
.dag{background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.dag h3{font-size:14px;font-weight:600;margin-bottom:12px;letter-spacing:-0.2px}
.dag-node{cursor:pointer;transition:opacity .2s,transform .2s}
.dag-node:hover{opacity:0.85;transform:translateY(-1px)}
.node-popup{display:none;position:absolute;background:var(--surface-3);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;z-index:100;min-width:300px;box-shadow:var(--shadow-card);font-size:13px}
.node-popup .close{float:right;cursor:pointer;color:var(--text-tertiary);font-size:16px}
.detail{background:var(--surface-2);border-left:1px solid var(--glass-border);padding:16px;overflow-y:auto}
.detail h3{font-size:16px;font-weight:600;letter-spacing:-0.2px;margin-bottom:2px}
.detail .meta{font-family:var(--mono);font-size:12px;color:var(--text-secondary);margin-bottom:12px}
.detail-section{margin-bottom:16px}
.detail-section h4{font-size:11px;letter-spacing:0.2em;color:var(--text-tertiary);text-transform:uppercase;margin-bottom:6px}
.detail-section pre{font-size:12px;letter-spacing:-0.2px;color:var(--text-secondary);background:var(--surface);border-radius:var(--radius-sm);padding:10px;font-family:var(--mono);overflow-x:auto;max-height:160px;overflow-y:auto;line-height:1.4}
.artifact-link{color:var(--accent);font-family:var(--mono);font-size:12px;cursor:pointer;display:block;margin:4px 0}
.artifact-link:hover{text-decoration:underline}
.progress{height:3px;background:var(--surface-3);border-radius:2px;margin:8px 0;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease;box-shadow:0 0 8px var(--accent-glow)}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--glass-border)}
.step .icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.step-done .icon{background:rgba(48,209,88,0.15);color:var(--good)}
.step-active .icon{background:rgba(0,113,227,0.2);color:var(--accent);box-shadow:0 0 12px var(--accent-glow)}
.step-pending .icon{background:rgba(255,255,255,0.04);color:var(--text-tertiary)}
.step-info{font-size:12px;letter-spacing:-0.2px;flex:1}.step-time{font-size:10px;color:var(--text-tertiary)}
.chat-bar{background:var(--glass);backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--glass-border);padding:14px 24px;display:flex;gap:10px;align-items:center;flex-shrink:0}
.chat-input{flex:1;background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--radius-pill);padding:11px 18px;font-size:14px;color:var(--text);font-family:var(--font);letter-spacing:-0.2px;outline:none;transition:border-color .2s,box-shadow .2s}
.chat-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.chat-input:disabled{opacity:0.4;cursor:not-allowed}
.chat-send{background:var(--accent);color:#fff;border:none;border-radius:var(--radius-pill);padding:9px 20px;font-size:13px;font-weight:600;letter-spacing:-0.1px;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.chat-send:hover{opacity:0.85}.chat-send:disabled{opacity:0.4;cursor:not-allowed;background:var(--text-tertiary)}
.warn-banner{background:rgba(255,159,10,0.08);border:1px solid rgba(255,159,10,0.2);border-radius:var(--radius);padding:8px 12px;font-size:12px;color:var(--warn);margin-bottom:8px;display:none}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:2px}
@media(max-width:1024px){.app-layout{grid-template-columns:1fr}.sidebar,.detail{display:none}}
</style>
</head>
<body>

<div class="nav-glass">
  <div class="logo">⚙️ Dev-Flow · AI 开发流程编排</div>
  <div class="status">
    <span><span class="dot dot-online" id="claude-dot"></span> Claude Code 2.1.197</span>
    <span><span class="dot dot-online" id="redis-dot"></span> Redis</span>
    <span><span class="dot dot-offline" id="k3s-dot"></span> <span id="k3s-label">K3s: 未连接</span></span>
    <span id="live-time" style="font-family:var(--mono);font-size:11px"></span>
  </div>
</div>

<div class="app-layout">

<div class="sidebar" id="sidebar">
  <div class="warn-banner" id="k3s-warn">⚠️ K3s 未连接 — L1 Pod 模式不可用</div>
  <h3>📋 任务列表</h3>
  <div id="task-list">加载中...</div>
  <h3>🤖 Worker 节点</h3>
  <div id="worker-list" style="font-size:11px;color:var(--text-tertiary)">暂无 Pod</div>
</div>

<div class="main" id="main-panel">
  <h2 id="task-title">选择任务查看详情</h2>
  <p class="subtitle" id="task-subtitle">从左侧列表点击任务，或从下方输入新需求</p>
  <div class="metrics" id="metrics-cards"></div>
  <div class="dag">
    <h3>📊 任务调度流程</h3>
    <div id="dag-content" style="min-height:140px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);font-size:14px">选择任务以查看调度流程</div>
  </div>
  <div id="welcome-msg" style="text-align:center;padding:40px 20px;color:var(--text-tertiary);font-size:14px">
    <p style="margin-bottom:12px">从左侧选择一个任务查看实时进度</p><p style="font-size:12px">或在下方输入新需求发起任务</p>
  </div>
  <div id="node-popup" class="node-popup" onclick="event.stopPropagation()">
    <span class="close" onclick="document.getElementById('node-popup').style.display='none'">×</span>
    <div id="node-popup-content"></div>
  </div>
</div>

<div class="detail" id="detail-panel">
  <h3>任务详情</h3>
  <p class="meta" id="detail-meta">请选择任务</p>
  <div id="detail-content"></div>
</div>

</div>

<div class="chat-bar">
  <input class="chat-input" id="chat-input" placeholder="输入新需求... 例如: deer-flow 加一个 /health 接口"
    onkeydown="if(event.key==='Enter')sendTask()">
  <button class="chat-send" id="chat-send" onclick="sendTask()">发起任务</button>
</div>

<script>
let tasks=[],selectedId=null,k3sOnline=false;

// ── Sort: running first, then newest ──
function sortTasks(list){return list.sort((a,b)=>{
  let rank=s=>(s==='EXECUTING'||s==='VERIFY_GATE')?0:(s==='DONE')?2:1;
  let ra=rank(a.status),rb=rank(b.status);
  if(ra!==rb)return ra-rb;
  return(b.id||'').localeCompare(a.id||'');
})}

async function loadState(){try{
  let r=await fetch('/api/state'),d=await r.json();
  tasks=sortTasks(d.tasks||[]);
  k3sOnline=(d.pods||[]).length>0;
  renderSidebar();renderMetrics();updateControls();
  let pods=d.pods||[],e=document.getElementById('k3s-label'),
  de=document.getElementById('k3s-dot');
  e.textContent=pods.length?'K3s: '+pods[0].name:'K3s: 未连接';
  de.className='dot '+(pods.length?'dot-online':'dot-offline');
  document.getElementById('worker-list').innerHTML=pods.length?pods.map(p=>`<div style="padding:4px 8px;border-radius:8px;background:var(--surface);margin:4px 0">${p.name.split('-').pop()}<br><span style="color:var(--good);font-size:10px">${p.status}</span></div>`).join(''):'暂无 Pod';
  if(selectedId)renderDetail(selectedId);
  document.getElementById('live-time').textContent=new Date().toLocaleTimeString();
}catch(e){}}

function updateControls(){
  let inp=document.getElementById('chat-input'),btn=document.getElementById('chat-send'),
      warn=document.getElementById('k3s-warn');
  let goal=inp.value.trim().toLowerCase();
  if(!k3sOnline && (goal.includes('pod')||goal.includes('l1'))) {
    inp.disabled=true;btn.disabled=true;warn.style.display='block';
    inp.placeholder='K3s 未连接 — 仅支持 L0 本地模式';
  } else {
    inp.disabled=false;btn.disabled=false;warn.style.display='none';
    inp.placeholder='输入新需求... 例如: deer-flow 加一个 /health 接口';
  }
}

function renderSidebar(){
  document.getElementById('task-list').innerHTML=tasks.length?tasks.map(t=>`
    <div class="task-item${t.id===selectedId?' active':''}" onclick="renderDetail('${t.id}')">
      <span class="id">${(t.id||'').slice(-16)}</span>
      <span class="title">${t.id||'?'}</span>
      <span class="badge badge-${t.status==='DONE'?'done':t.status==='EXECUTING'||t.status==='VERIFY_GATE'?'running':t.status==='FAILED'?'failed':'pending'}">${t.status||'?'}</span>
      ${t.status==='EXECUTING'||t.status==='VERIFY_GATE'?`<button class="stop-btn" onclick="event.stopPropagation();stopTask('${t.id}')">⏹</button>`:''}
    </div>
  `).join(''):'<span style="color:var(--text-tertiary);font-size:12px">暂无任务</span>';
}

function renderMetrics(){
  let total=tasks.length,done=tasks.filter(t=>t.status==='DONE').length,
      running=tasks.filter(t=>t.status==='EXECUTING'||t.status==='VERIFY_GATE').length,
      cost=(done*0.08).toFixed(2);
  document.getElementById('metrics-cards').innerHTML=`
    <div class="metric-card"><div class="label">总任务数</div><div class="value">${total}</div></div>
    <div class="metric-card"><div class="label">已完成</div><div class="value">${done}</div><div class="trend">${total?(done/total*100).toFixed(0):0}% 完成率</div></div>
    <div class="metric-card"><div class="label">进行中</div><div class="value">${running}</div></div>
    <div class="metric-card"><div class="label">预估成本</div><div class="value" style="font-size:28px">$${cost}</div></div>`;
}

async function loadArtifacts(id){
  let r=await fetch('/api/artifacts/'+id);
  return r.ok?r.json():{commits:[],evidence:{},output:{}};
}

function showNodeDetail(id,stepLabel){
  let popup=document.getElementById('node-popup'),c=document.getElementById('node-popup-content');
  let t=tasks.find(x=>x.id===id);
  if(!t)return;
  c.innerHTML=`<div style="font-weight:600;margin-bottom:8px">📌 ${stepLabel}</div>
    <div style="color:var(--text-secondary);font-size:12px">任务: ${id}</div>
    <div style="color:var(--text-secondary);font-size:12px;margin-top:4px">状态: ${t.status||'?'} · Worker: ${t.worker||'-'}</div>
    <div style="margin-top:8px;font-size:11px;color:var(--text-tertiary)">点击 DAG 节点查看该阶段详细产物...</div>`;
  popup.style.display='block';
  loadArtifacts(id).then(a=>{
    c.innerHTML=`<div style="font-weight:600;margin-bottom:8px">📌 ${stepLabel}</div>
      <div style="color:var(--text-secondary);font-size:12px">任务: ${id}</div>
      ${a.commits&&a.commits.length?`<div style="margin-top:8px"><div style="font-size:11px;color:var(--text-tertiary);margin-bottom:4px">📦 产物</div>${a.commits.map(c=>`<span class="artifact-link">🔗 ${c}</span>`).join('')}</div>`:''}
      ${a.output?.diff_stat?`<div style="margin-top:8px"><pre style="font-size:11px">${a.output.diff_stat}</pre></div>`:''}`;
  });
  setTimeout(()=>{popup.style.display='none'},5000);
}

function renderDetail(id){
  selectedId=id;let t=tasks.find(x=>x.id===id);
  if(!t)return;
  document.getElementById('task-title').textContent=t.id||'?';
  document.getElementById('task-subtitle').textContent=`状态: ${t.status||'?'} · Worker: ${t.worker||'-'}`;
  document.getElementById('detail-meta').textContent=`ID: ${t.id||'?'}`;
  document.getElementById('welcome-msg').style.display='none';

  let steps=[{id:'CREATED',label:'已创建',icon:'📝'},{id:'PLANNING',label:'方案规划',icon:'📋'},
    {id:'GATE_PENDING',label:'等待闸门',icon:'🛡️'},{id:'EXECUTING',label:'AI 执行中',icon:'🤖'},
    {id:'VERIFY_GATE',label:'等待验证',icon:'🔍'},{id:'DONE',label:'已完成',icon:'✅'}];
  let statusIdx=steps.findIndex(s=>s.id===t.status),
      pct=Math.max(0,statusIdx>=0?(statusIdx+1)/6*100:0);

  document.getElementById('detail-content').innerHTML=`
    <div class="detail-section"><h4>📊 执行进度</h4>
      <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
      ${steps.map((s,i)=>{
        let cls=i<statusIdx?'step-done':i===statusIdx?'step-active':'step-pending';
        return `<div class="step ${cls}" onclick="showNodeDetail('${id}','${s.label}')" style="cursor:pointer" title="点击查看 ${s.label} 详情">
          <div class="icon">${s.icon}</div><div class="step-info">${s.label}</div></div>`;
      }).join('')}
    </div>
    <div class="detail-section"><h4>📝 任务信息</h4>
      <p style="font-size:12px;background:var(--surface);border-radius:8px;padding:10px;color:var(--text-secondary)">
        类型: ${t.task_type||'?'}<br>Worker: ${t.worker||'-'}<br>状态: ${t.status||'?'}
        ${t.status==='EXECUTING'?`<br><button onclick="stopTask('${id}')" style="margin-top:8px;background:var(--bad);color:#fff;border:none;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:11px">⏹ 停止任务</button>`:''}
      </p>
    </div>`;

  // DAG with clickable nodes
  let dag=document.getElementById('dag-content');
  dag.innerHTML=`<svg viewBox="0 0 600 100" style="max-width:600px">
    <defs><marker id="arrow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4Z" fill="#0071e3"/></marker></defs>
    ${steps.map((s,i)=>{
      let x=15+i*95,y=22,active=i<=statusIdx;
      return `<g class="dag-node" onclick="showNodeDetail('${id}','${s.label}')">
        <rect x="${x}" y="${y}" width="82" height="44" rx="10" fill="${active?'rgba(0,113,227,'+(0.06+i*0.04)+')':'rgba(255,255,255,0.02)'}" stroke="${active?'var(--accent)':'var(--glass-border)'}" stroke-width="${active?'1.5':'1'}"/>
        <text x="${x+41}" y="${y+20}" text-anchor="middle" fill="${active?'var(--text)':'var(--text-tertiary)'}" font-size="10">${s.icon} ${s.label}</text>
        <text x="${x+41}" y="${y+36}" text-anchor="middle" fill="${active?'var(--accent)':'var(--text-tertiary)'}" font-size="8">${active?'✓':i===statusIdx?'●':''}</text>
      </g>${i<5?`<line x1="${x+82}" y1="${y+22}" x2="${x+95}" y2="${y+22}" stroke="${active?'var(--accent)':'var(--glass-border)'}" stroke-width="1.5" marker-end="url(#arrow)"/>`:''}`;
    }).join('')}</svg>${statusIdx>=0?`<div style="text-align:center;margin-top:12px;font-size:11px;color:var(--text-tertiary)">点击任意节点查看阶段详情</div>`:''}`;
  renderSidebar();
}

async function stopTask(id){
  if(!confirm('确定停止任务 '+id+'？'))return;
  await fetch('/api/stop/'+id,{method:'POST'});
  await loadState();
}

async function sendTask(){
  let input=document.getElementById('chat-input'),goal=input.value.trim();
  if(!goal)return;
  if(!k3sOnline&&(goal.toLowerCase().includes('pod')||goal.toLowerCase().includes('l1'))){
    alert('K3s 未连接 — 请先启动 K3s 集群或使用 L0 本地模式（不说 "pod" 即可）');return;}
  input.value='';let r=await fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal})});
  let d=await r.json();
  if(d.task_id){selectedId=d.task_id;await loadState();renderDetail(d.task_id)}else alert('创建失败: '+(d.error||'未知错误'))
}

loadState();setInterval(loadState,5000);
</script>
</body>
</html>
